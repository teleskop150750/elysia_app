openapi: 3.1.0
info:
  title: ACRM API
  version: 0.0.0
tags:
  - name: Sessions
  - name: Workspaces
  - name: Customers
  - name: Handsets
  - name: Vehicles
  - name: Offers
  - name: Pipelines
paths:
  /api/v2/current-session/create:
    post:
      operationId: Api_createCurrentSession
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
  /api/v2/current-session/delete:
    delete:
      operationId: Api_deleteCurrentSession
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      tags:
        - Sessions
  /api/v2/me/get:
    post:
      operationId: Api_getMe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      tags:
        - Sessions
  /api/v2/workspace-list/get:
    post:
      operationId: Api_getWorkspaceList
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
      tags:
        - Workspaces
  /api/v2/workspace/{workspaceId}/car-list/filter-options/get:
    post:
      operationId: Api_getVehicleFilterOptions
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclesFilterOptionsResponse'
      tags:
        - Vehicles
  /api/v2/workspace/{workspaceId}/current-handset/delete:
